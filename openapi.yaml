openapi: 3.1.0
info:
  title: API Hackathon
  description: |
    Questions posées à l'IA et réponses enregistrées dans PostgreSQL.

    L'IA est choisie dans `api/.env` : un fournisseur compatible OpenAI (mode 1),
    ou l'API de l'équipe Data/IA dès que `DATA_AI_URL` est renseignée (mode 2).
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
        - santé
      summary: État de l'API et de la base
      description: 'Utilisé par le healthcheck Docker : sain = API démarrée ET base joignable.'
      operationId: read_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRead'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
  /api/v1/questions:
    get:
      tags:
        - questions
      summary: Dernières questions posées
      description: Les 10 dernières questions et leurs réponses, la plus récente en premier.
      operationId: list_questions_api_v1_questions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/QuestionRead'
                type: array
                title: Response List Questions Api V1 Questions Get
    post:
      tags:
        - questions
      summary: Poser une question à l'IA
      description: Envoie la question à l'IA (mode 1 ou 2 selon api/.env), enregistre l'échange.
      operationId: create_question_api_v1_questions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRead'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ErrorRead:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
        - detail
      title: ErrorRead
      description: Format des erreurs renvoyées par l'API (le même que celui de FastAPI).
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthRead:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        db:
          type: string
          title: Db
          description: Version du serveur PostgreSQL
      type: object
      required:
        - db
      title: HealthRead
      description: API démarrée et base joignable.
    QuestionCreate:
      properties:
        question:
          type: string
          maxLength: 4000
          minLength: 1
          title: Question
          examples:
            - Quelle est la capitale de la France ?
      type: object
      required:
        - question
      title: QuestionCreate
      description: Corps de POST /questions.
    QuestionRead:
      properties:
        id:
          type: integer
          title: Id
        question:
          type: string
          title: Question
        answer:
          type: string
          title: Answer
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - id
        - question
        - answer
        - created_at
      title: QuestionRead
      description: |
        Une question et la réponse de l'IA, telles qu'enregistrées.

        from_attributes : construit depuis le QuestionRecord renvoyé par le service.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
tags:
  - name: santé
    description: Healthcheck de l'API et de la base.
  - name: questions
    description: Poser une question, relire l'historique.
