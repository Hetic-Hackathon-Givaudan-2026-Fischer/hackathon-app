openapi: 3.1.0
info:
  title: API Hackathon
  description:
    "\nInterface interne Givaudan : tendances d'arômes, rapport d'analyse, showroom.\n\
    \n- **Tendances** : lues dans l'API Data/IA (`DATA_AI_URL`), ou dans le CSV de\n  repli\
    \ quand elle est vide ou injoignable. Chaque réponse porte `origin`\n  (`data_ai` | `csv_fallback`)\
    \ et `data_date`.\n- **Rapport** : provenance, traitements et qualité des données ; signalements.\n\
    - **Showroom** : liens temporaires, sans compte, en lecture seule.\n\nChaque réponse porte\
    \ un en-tête `X-Request-ID`, à communiquer au support.\n"
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
        - santé
      summary: État de l'API, de la base et de l'API Data/IA
      description: "Healthcheck Docker : sain = API démarrée ET base joignable.


        `data_ai` est informatif : Data/IA coupée ne rend pas l'API « unhealthy »."
      operationId: read_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRead'
        '503':
          description: Base ou source de données injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
  /api/v1/families:
    get:
      tags:
        - dashboard
      summary: Familles d'arômes
      description: Chaque famille, son nombre d'arômes et sa croissance moyenne sur 3 mois.
      operationId: list_families_api_v1_families_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyListRead'
  /api/v1/dashboard/summary:
    get:
      tags:
        - dashboard
      summary: KPI du dashboard
      description:
        Calculés par l'API, identiques que les données viennent de Data/IA ou du
        CSV.
      operationId: read_summary_api_v1_dashboard_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryRead'
  /api/v1/trends:
    get:
      tags:
        - tendances
      summary: Arômes filtrés, triés et paginés
      description:
        'Filtres famille, statut et recherche (nom ou identifiant, sans accents).


        Les valeurs absentes sont triées en dernier. En repli CSV, `status` et

        `score` sont null : filtrer par statut ne renvoie alors rien.'
      operationId: list_trends_api_v1_trends_get
      parameters:
        - name: family
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 100
              - type: 'null'
            title: Family
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 100
              - type: 'null'
            description: Libellé exact du statut
            title: Status
          description: Libellé exact du statut
        - name: search
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 100
              - type: 'null'
            title: Search
        - name: sort
          in: query
          required: false
          schema:
            enum:
              - name
              - score
              - recherche_croissance_13s_pct
              - recherche_croissance_52s_pct
              - recherche_volatilite_26s
              - recherche_pic_ratio
              - popularite_vs_vanille
              - wiki_vues_30j
              - wiki_croissance_3m_pct
              - wiki_croissance_12m_pct
              - wiki_croissance_3m_relative
              - wiki_croissance_12m_relative
              - wiki_volatilite_26s
              - produits_total
              - produits_nouveaux_12m
              - produits_croissance_12m_pct
              - marques_distinctes
              - pays_distincts
              - mentions_presse_30j
              - mentions_reseaux_30j
              - youtube_vues_30j
              - likes_30j
              - part_sponsorise_30j
              - pinterest_tendances_30j
            type: string
            default: wiki_croissance_12m_relative
            title: Sort
        - name: order
          in: query
          required: false
          schema:
            enum:
              - asc
              - desc
            type: string
            default: desc
            title: Order
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendListRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trends/{trend_id}:
    get:
      tags:
        - tendances
      summary: Fiche d'un arôme
      description: Indicateurs, verdict du modèle et série temporelle (Data/IA seulement).
      operationId: read_trend_api_v1_trends__trend_id__get
      parameters:
        - name: trend_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            description: Identifiant de l'arôme
            title: Trend Id
          description: Identifiant de l'arôme
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendDetailRead'
        '404':
          description: Ressource inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/report:
    get:
      tags:
        - rapport
      summary: Provenance et qualité du jeu de données
      description: Origine, date, sources des indicateurs, traitements, qualité calculée.
      operationId: read_dataset_report_api_v1_report_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetReportRead'
  /api/v1/report/trends/{trend_id}:
    get:
      tags:
        - rapport
      summary: Provenance et qualité d'un arôme
      description: Chaque indicateur de l'arôme, sa source, sa valeur ; qualité par source.
      operationId: read_trend_report_api_v1_report_trends__trend_id__get
      parameters:
        - name: trend_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            description: Identifiant de l'arôme
            title: Trend Id
          description: Identifiant de l'arôme
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendReportRead'
        '404':
          description: Ressource inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/report/model:
    get:
      tags:
        - rapport
      summary: Métriques du modèle V1 / V2
      description:
        'F1 et matrice de confusion ; `available: false` en repli CSV (jamais de
        5xx).'
      operationId: read_model_report_api_v1_report_model_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelReportRead'
  /api/v1/report/issues:
    post:
      tags:
        - rapport
      summary: Signaler un problème de données
      description: Enregistre le message, l'origine des données et le `request_id` de l'appel.
      operationId: create_issue_api_v1_report_issues_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataIssueCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataIssueRead'
        '404':
          description: Ressource inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '503':
          description: Base ou source de données injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/showroom/links:
    get:
      tags:
        - showroom
      summary: Liens showroom
      description: Tous les liens, le plus récent en premier, avec leur état ; sans jeton.
      operationId: list_links_api_v1_showroom_links_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ShowroomLinkRead'
                type: array
                title: Response List Links Api V1 Showroom Links Get
        '503':
          description: Base ou source de données injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
    post:
      tags:
        - showroom
      summary: Créer un lien showroom
      description: Le jeton et l'URL ne sont renvoyés qu'ici, une seule fois.
      operationId: create_link_api_v1_showroom_links_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowroomLinkCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowroomLinkCreatedRead'
        '503':
          description: Base ou source de données injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/showroom/links/{link_id}:
    delete:
      tags:
        - showroom
      summary: Révoquer un lien showroom
      description: Le lien répond ensuite `410` ; révoquer deux fois ne change rien.
      operationId: revoke_link_api_v1_showroom_links__link_id__delete
      parameters:
        - name: link_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            title: Link Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Ressource inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '503':
          description: Base ou source de données injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/showroom/{token}:
    get:
      tags:
        - showroom
      summary: Vue client d'un lien showroom
      description: 'Lecture seule : les arômes du périmètre du lien, ni dashboard ni rapport.'
      operationId: read_showroom_api_v1_showroom__token__get
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowroomRead'
        '404':
          description: Ressource inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '410':
          description: Lien showroom expiré ou révoqué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '503':
          description: Base ou source de données injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ConfusionMatrixRead:
      properties:
        perennial_predicted_perennial:
          type: integer
          title: Perennial Predicted Perennial
        perennial_predicted_buzz:
          type: integer
          title: Perennial Predicted Buzz
        buzz_predicted_perennial:
          type: integer
          title: Buzz Predicted Perennial
        buzz_predicted_buzz:
          type: integer
          title: Buzz Predicted Buzz
      type: object
      required:
        - perennial_predicted_perennial
        - perennial_predicted_buzz
        - buzz_predicted_perennial
        - buzz_predicted_buzz
      title: ConfusionMatrixRead
      description: Cas réels (pérenne / buzz) croisés avec la prédiction du modèle.
    DashboardSummaryRead:
      properties:
        origin:
          type: string
          enum:
            - data_ai
            - csv_fallback
          title: Origin
          description: '`data_ai` : API Data/IA ; `csv_fallback` : CSV, sans modèle'
        data_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          title: Data Date
          description: Date des données servies
        trend_count:
          type: integer
          title: Trend Count
        family_count:
          type: integer
          title: Family Count
        scored_count:
          type: integer
          title: Scored Count
          description: Arômes avec un statut (0 en repli CSV)
        status_counts:
          additionalProperties:
            type: integer
          type: object
          title: Status Counts
        totals:
          additionalProperties:
            type: number
          type: object
          title: Totals
        top_growing:
          items:
            $ref: '#/components/schemas/TrendRead'
          type: array
          title: Top Growing
      type: object
      required:
        - origin
        - data_date
        - trend_count
        - family_count
        - scored_count
        - status_counts
        - totals
        - top_growing
      title: DashboardSummaryRead
      description: KPI du dashboard, calculés par l'API quelle que soit l'origine.
    DataIssueCreate:
      properties:
        trend_id:
          anyOf:
            - type: string
              maxLength: 100
            - type: 'null'
          title: Trend Id
          description: 'Arôme concerné ; absent : le rapport global'
        message:
          type: string
          maxLength: 2000
          minLength: 1
          title: Message
          examples:
            - Les vues Wikipédia de l'açaï sont à 0.
        contact:
          anyOf:
            - type: string
              format: email
            - type: 'null'
          title: Contact
          description: Pour vous recontacter
      type: object
      required:
        - message
      title: DataIssueCreate
      description: Corps de POST /report/issues.
    DataIssueRead:
      properties:
        id:
          type: integer
          title: Id
        trend_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Trend Id
        message:
          type: string
          title: Message
        contact:
          anyOf:
            - type: string
            - type: 'null'
          title: Contact
        request_id:
          type: string
          title: Request Id
          description: À communiquer au support
        data_origin:
          type: string
          enum:
            - data_ai
            - csv_fallback
          title: Data Origin
          description: Origine des données au signalement
        status:
          type: string
          enum:
            - open
            - in_progress
            - resolved
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - id
        - trend_id
        - message
        - contact
        - request_id
        - data_origin
        - status
        - created_at
      title: DataIssueRead
    DataProvenanceRead:
      properties:
        origin:
          type: string
          enum:
            - data_ai
            - csv_fallback
          title: Origin
        data_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          title: Data Date
          description: Date des données
        fetched_at:
          type: string
          format: date-time
          title: Fetched At
          description: Date de récupération par notre API
        api_version:
          anyOf:
            - type: string
            - type: 'null'
          title: Api Version
          description: Version de l'API Data/IA
        model_applied:
          type: boolean
          title: Model Applied
          description: 'false en repli CSV : indicateurs bruts'
      type: object
      required:
        - origin
        - data_date
        - fetched_at
        - api_version
        - model_applied
      title: DataProvenanceRead
    DatasetReportRead:
      properties:
        origin:
          type: string
          enum:
            - data_ai
            - csv_fallback
          title: Origin
          description: '`data_ai` : API Data/IA ; `csv_fallback` : CSV, sans modèle'
        data_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          title: Data Date
          description: Date des données servies
        status:
          type: string
          enum:
            - ok
            - warning
            - error
          title: Status
          description: Statut global, calculé
        trend_count:
          type: integer
          title: Trend Count
        provenance:
          $ref: '#/components/schemas/DataProvenanceRead'
        indicators:
          items:
            $ref: '#/components/schemas/IndicatorSourceRead'
          type: array
          title: Indicators
        steps:
          items:
            $ref: '#/components/schemas/ProcessingStepRead'
          type: array
          title: Steps
        quality:
          items:
            $ref: '#/components/schemas/QualityMetricRead'
          type: array
          title: Quality
      type: object
      required:
        - origin
        - data_date
        - status
        - trend_count
        - provenance
        - indicators
        - steps
        - quality
      title: DatasetReportRead
      description: Provenance et qualité de tout le jeu de données.
    ErrorRead:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
        - detail
      title: ErrorRead
      description: Format des erreurs renvoyées par l'API (le même que celui de FastAPI).
    EvidenceRead:
      properties:
        source:
          type: string
          title: Source
        published:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          title: Published
        title:
          type: string
          title: Title
        url:
          type: string
          title: Url
      type: object
      required:
        - source
        - published
        - title
        - url
      title: EvidenceRead
    FamilyListRead:
      properties:
        origin:
          type: string
          enum:
            - data_ai
            - csv_fallback
          title: Origin
          description: '`data_ai` : API Data/IA ; `csv_fallback` : CSV, sans modèle'
        data_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          title: Data Date
          description: Date des données servies
        items:
          items:
            $ref: '#/components/schemas/FamilyRead'
          type: array
          title: Items
      type: object
      required:
        - origin
        - data_date
        - items
      title: FamilyListRead
    FamilyRead:
      properties:
        family:
          type: string
          title: Family
        trend_count:
          type: integer
          title: Trend Count
        average_growth:
          anyOf:
            - type: number
            - type: 'null'
          title: Average Growth
          description: Moyenne de `wiki_croissance_12m_relative` sur la famille
      type: object
      required:
        - family
        - trend_count
        - average_growth
      title: FamilyRead
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthRead:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        db:
          type: string
          title: Db
          description: Version du serveur PostgreSQL
        data_ai:
          type: string
          enum:
            - up
            - down
            - non_configuree
          title: Data Ai
          description: API Data/IA ; `down` ne rend pas l'API « unhealthy » (repli CSV)
      type: object
      required:
        - db
        - data_ai
      title: HealthRead
      description: API démarrée et base joignable. L'état Data/IA est informatif seulement.
    IndicatorSourceRead:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        source:
          $ref: '#/components/schemas/Source'
        source_label:
          type: string
          title: Source Label
        period:
          type: string
          title: Period
        value:
          anyOf:
            - type: number
            - type: 'null'
          title: Value
          description: Valeur pour l'arôme (rapport par arôme seulement)
      type: object
      required:
        - key
        - label
        - source
        - source_label
        - period
      title: IndicatorSourceRead
    ModelReportRead:
      properties:
        available:
          type: boolean
          title: Available
        reason:
          anyOf:
            - type: string
            - type: 'null'
          title: Reason
          description: Pourquoi les métriques manquent
        validation:
          anyOf:
            - type: string
            - type: 'null'
          title: Validation
          description: Méthode de validation du modèle
        label_rule:
          anyOf:
            - type: string
            - type: 'null'
          title: Label Rule
          description: Définition d'un buzz / d'un pérenne
        interpretation:
          anyOf:
            - type: string
            - type: 'null'
          title: Interpretation
          description: Comment lire ces métriques
        case_count:
          anyOf:
            - type: integer
            - type: 'null'
          title: Case Count
          description: Nombre de cas de validation
        features:
          items:
            type: string
          type: array
          title: Features
          description: Variables du modèle
        models:
          items:
            $ref: '#/components/schemas/ModelScoreRead'
          type: array
          title: Models
      type: object
      required:
        - available
        - reason
        - validation
        - label_rule
        - interpretation
        - case_count
        - features
        - models
      title: ModelReportRead
      description: 'Validation du modèle V2 et de ses références ; `available: false` en repli.'
    ModelScoreRead:
      properties:
        version:
          type: string
          title: Version
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        accuracy:
          anyOf:
            - type: number
            - type: 'null'
          title: Accuracy
        balanced_accuracy:
          anyOf:
            - type: number
            - type: 'null'
          title: Balanced Accuracy
          description: Métrique à lire en premier
        buzz_detected:
          anyOf:
            - type: number
            - type: 'null'
          title: Buzz Detected
          description: Part des vrais buzz repérés
        f1:
          anyOf:
            - type: number
            - type: 'null'
          title: F1
          description: F1 de la classe pérenne (modèle seulement)
        roc_auc:
          anyOf:
            - type: number
            - type: 'null'
          title: Roc Auc
        confusion:
          anyOf:
            - $ref: '#/components/schemas/ConfusionMatrixRead'
            - type: 'null'
      type: object
      required:
        - version
        - description
        - accuracy
        - balanced_accuracy
        - buzz_detected
        - f1
        - roc_auc
        - confusion
      title: ModelScoreRead
      description: Le modèle V2 ou une référence (V1, « toujours pérenne »).
    ProcessingStepRead:
      properties:
        order:
          type: integer
          title: Order
        name:
          type: string
          title: Name
        version:
          anyOf:
            - type: string
            - type: 'null'
          title: Version
        description:
          type: string
          title: Description
      type: object
