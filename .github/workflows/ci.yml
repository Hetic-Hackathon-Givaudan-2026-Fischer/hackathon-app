name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  # Le front et la configuration du dépôt : ESLint, Prettier, build Vite
  qualite:
    runs-on: ubuntu-latest
    # Même Node et même Debian que le dev container
    container: node:24-trixie
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Types du front générés depuis openapi.yaml (ADR 0012) : sinon, npm run gen:api
      - run: npm run gen:api && git diff --exit-code web/src/api/schema.d.ts
      - run: npm run build

  # L'API FastAPI : Ruff (lint + format), contrat OpenAPI à jour. Tests : tests.yml
  api:
    runs-on: ubuntu-latest
    # Même Python (3.13), même uv et même Debian que api/Dockerfile et le dev container
    container: ghcr.io/astral-sh/uv:0.13.7-python3.13-trixie-slim
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      # --locked : échoue si uv.lock ne correspond plus à pyproject.toml
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # openapi.yaml (racine) doit refléter le code : sinon, régénérer et commiter
      - run: uv run python -m app.scripts.export_openapi --check
