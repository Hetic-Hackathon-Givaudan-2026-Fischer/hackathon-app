name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]

# Lecture seule : les tests n'ont besoin que du code
permissions:
  contents: read

# Un nouveau push sur la PR annule le run précédent, devenu inutile
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # L'API FastAPI : tests unitaires, d'API et d'intégration (pytest)
  api:
    runs-on: ubuntu-latest
    # Même Python (3.13), même uv et même Debian que api/Dockerfile et le dev container
    container: ghcr.io/astral-sh/uv:0.11.11-python3.13-trixie-slim
    # Même PostgreSQL que compose.yml, pour les tests d'intégration des repositories
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Job en conteneur : le service se joint par son nom. Sans cette variable,
      # les tests d'intégration sont sautés (pratique en local)
      TEST_DATABASE_URL: postgresql://app:app@postgres:5432/app
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      # --locked : échoue si uv.lock ne correspond plus à pyproject.toml
      - run: uv sync --locked
      - run: uv run pytest
