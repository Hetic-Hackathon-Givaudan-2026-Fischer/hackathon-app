name: hackathon

# Base commune à tous les conteneurs de code (Node et Python) : même projet monté.
# init relaie Ctrl+C / docker stop jusqu'à npm, vite et uvicorn
x-workspace: &workspace
  init: true
  working_dir: /workspace
  volumes:
    - .:/workspace:cached
  extra_hosts:
    # Rend l'hôte joignable sous Linux (Docker Desktop le fait déjà), pour Ollama
    - host.docker.internal:host-gateway

# Conteneurs Node (install, web, dev). Image officielle slim : rien à compiler
x-node: &node
  <<: *workspace
  image: node:24-trixie-slim
  # Même uid que sur l'hôte (1000) : les fichiers créés restent les tiens
  user: node

# Rythme commun des healthchecks : sondes rapprochées pendant le démarrage
# (start_interval), puis espacées une fois le service sain
x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 30s
  start_interval: 2s

# Sonde HTTP pour les services Node : fetch natif de Node 24, sans curl/wget.
# Chaque service fournit son URL via HEALTHCHECK_URL
x-http-healthcheck: &http-healthcheck
  <<: *healthcheck-timing
  test:
    - CMD
    - node
    - -e
    - 'fetch(process.env.HEALTHCHECK_URL).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'

# API Python : urllib de la bibliothèque standard, sans curl/wget
# urlopen lève une exception (code de sortie 1) si la réponse n'est pas 2xx
x-python-healthcheck: &python-healthcheck
  <<: *healthcheck-timing
  test:
    - CMD
    - python
    - -c
    - 'import os, urllib.request; urllib.request.urlopen(os.environ["HEALTHCHECK_URL"], timeout=2)'

services:
  # À chaque démarrage : les dépendances du front (versions du lockfile) et le
  # .env de l'API. Celles de l'API (Python) sont dans son image, voir « api ».
  # npm ci vide node_modules : relancé sous web en marche (dev container ouvert
  # après setup.sh), il fait planter vite. On ne le joue donc que si
  # package-lock.json a changé depuis la dernière installation
  install:
    <<: *node
    command:
      - sh
      - -c
      - |
        set -e
        stamp=node_modules/.package-lock.sha256
        if sha256sum -c "$$stamp" >/dev/null 2>&1; then
          echo "Dépendances à jour"
        else
          npm ci --no-audit --no-fund
          sha256sum package-lock.json > "$$stamp"
        fi
        test -f api/.env || cp api/.env.example api/.env

  # L'API FastAPI, rechargée à chaque modification (uvicorn --reload).
  # Image construite : Python 3.13, uv et les dépendances dans /opt/venv, hors du
  # montage (pas de conflit avec api/.venv du dev container). Utilisateur uid 1000
  api:
    <<: *workspace
    build:
      # Racine du projet : le .dockerignore en liste blanche s'applique
      context: .
      dockerfile: api/Dockerfile
      target: dev
    image: hackathon-api
    working_dir: /workspace/api
    # Pas de command : celle de la cible dev de api/Dockerfile (uvicorn --reload),
    # une seule source. uv resynchronise /opt/venv si uv.lock a changé
    environment:
      # /api/v1/health interroge PostgreSQL : sain = API démarrée ET base joignable
      HEALTHCHECK_URL: http://localhost:3000/api/v1/health
    healthcheck: *python-healthcheck
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      # Pour api/.env, créé par install à partir de api/.env.example
      install:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # Le front Vite ; les appels /api sont relayés au service « api »
  web:
    <<: *node
    working_dir: /workspace/web
    command: npm run dev
    environment:
      API_URL: http://api:3000
      HEALTHCHECK_URL: http://localhost:5173/
    healthcheck: *http-healthcheck
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      install:
        condition: service_completed_successfully
      # Le proxy /api n'a de sens qu'une fois l'API réellement prête
      api:
        condition: service_healthy

  # Le poste de travail : VS Code / Zed s'y attachent pour le terminal et les outils.
  # La même base Node, plus git, psql, Python 3.13 et uv
  dev:
    <<: *node
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: hackathon-dev
    command: sleep infinity
    depends_on:
      install:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # 5433 côté hôte : un PostgreSQL local occupe déjà le 5432 (TablePlus, psql…)
      - 127.0.0.1:5433:5432
    volumes:
      # Les données, dans un dossier du projet (ignoré par git)
      - ./db/data:/var/lib/postgresql/data
      # Schéma et données de test, joués au premier démarrage
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck-timing
      # -h 127.0.0.1 : pendant l'init (scripts de db/init), PostgreSQL tourne
      # sur un serveur temporaire sans TCP ; on ne passe sain qu'une fois le
      # vrai serveur démarré, pas au milieu du seed
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U app -d app']
      start_period: 60s
