name: hackathon

# Base commune aux conteneurs Node : même code monté, même utilisateur.
# Image officielle slim : Node suffit pour install, api et web (rien à compiler)
x-node: &node
  image: node:24-trixie-slim
  # Même uid que sur l'hôte (1000) : les fichiers créés restent les tiens
  user: node
  # Relaie Ctrl+C / docker stop jusqu'à npm, tsx et vite
  init: true
  working_dir: /workspace
  volumes:
    - .:/workspace:cached
  extra_hosts:
    # Rend l'hôte joignable sous Linux (Docker Desktop le fait déjà), pour Ollama
    - host.docker.internal:host-gateway

# Rythme commun des healthchecks : sondes rapprochées pendant le démarrage
# (start_interval), puis espacées une fois le service sain
x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 30s
  start_interval: 2s

# Sonde HTTP pour les services Node : fetch natif de Node 24, sans curl/wget.
# Chaque service fournit son URL via HEALTHCHECK_URL
x-http-healthcheck: &http-healthcheck
  <<: *healthcheck-timing
  test:
    - CMD
    - node
    - -e
    - 'fetch(process.env.HEALTHCHECK_URL).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'

services:
  # À chaque démarrage : les dépendances (versions du lockfile) et le .env local.
  # npm ci vide node_modules : relancé sous api et web en marche (dev container
  # ouvert après setup.sh), il fait planter tsx. On ne le joue donc que si
  # package-lock.json a changé depuis la dernière installation
  install:
    <<: *node
    command:
      - sh
      - -c
      - |
        set -e
        stamp=node_modules/.package-lock.sha256
        if sha256sum -c "$$stamp" >/dev/null 2>&1; then
          echo "Dépendances à jour"
        else
          npm ci --no-audit --no-fund
          sha256sum package-lock.json > "$$stamp"
        fi
        test -f api/.env || cp api/.env.example api/.env

  # L'API Express, rechargée à chaque modification (tsx watch)
  api:
    <<: *node
    working_dir: /workspace/api
    command: npm run dev
    environment:
      # /api/health interroge PostgreSQL : sain = API démarrée ET base joignable
      HEALTHCHECK_URL: http://localhost:3000/api/health
    healthcheck: *http-healthcheck
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      install:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # Le front Vite ; les appels /api sont relayés au service « api »
  web:
    <<: *node
    working_dir: /workspace/web
    command: npm run dev
    environment:
      API_URL: http://api:3000
      HEALTHCHECK_URL: http://localhost:5173/
    healthcheck: *http-healthcheck
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      install:
        condition: service_completed_successfully
      # Le proxy /api n'a de sens qu'une fois l'API réellement prête
      api:
        condition: service_healthy

  # Le poste de travail : VS Code / Zed s'y attachent pour le terminal et les outils.
  # Seul conteneur construit : la même base, plus git et psql
  dev:
    <<: *node
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: hackathon-dev
    command: sleep infinity
    depends_on:
      install:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # 5433 côté hôte : un PostgreSQL local occupe déjà le 5432 (TablePlus, psql…)
      - 127.0.0.1:5433:5432
    volumes:
      # Les données, dans un dossier du projet (ignoré par git)
      - ./db/data:/var/lib/postgresql/data
      # Schéma et données de test, joués au premier démarrage
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck-timing
      # -h 127.0.0.1 : pendant l'init (scripts de db/init), PostgreSQL tourne
      # sur un serveur temporaire sans TCP ; on ne passe sain qu'une fois le
      # vrai serveur démarré, pas au milieu du seed
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U app -d app']
      start_period: 60s
